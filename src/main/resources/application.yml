spring:
  datasource:
    url: jdbc:mysql://localhost:3306/interviewer_ai?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis-plus:
  global-config:
    db-config:
      id-type: ASSIGN_ID
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
ai:
  api-url: https://api.deepseek.com/chat/completions
  api-key: ${DEEPSEEK_API_KEY}
  model: deepseek-flash
  max-tokens: 2048
  default-temperature : 0.7
  tool-temperature : 0.1
  embedding-api-url: https://open.bigmodel.cn/api/paas/v4/embeddings
  embedding-api-key: ${ZHIPUAI_API_KEY}
  embedding-model: embedding-3
typesafe:
  api-key: ${TYPESAFE_API_KEY:}
  enabled: ${TYPESAFE_ENABLED:true}

admin:
  token: ${ADMIN_TOKEN}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
